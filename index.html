<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PASS - 나만의 개성있는 교통카드</title>
    <style>
        :root {
            --primary-color: #3b82f6; 
            --secondary-color: #10b981;
            --bg-color: #f1f5f9;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 8px;
        }
        .row > div {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        button.secondary {
            background-color: var(--secondary-color);
        }
        button.secondary:hover {
            background-color: #047857;
        }
        button.accent {
            background-color: #4f46e5;
        }
        button.accent:hover {
            background-color: #4338ca;
        }
        button.danger {
            background-color: #ef4444;
        }
        button.danger:hover {
            background-color: #dc2626;
        }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #f8fafc;
            border-left: 4px solid #64748b;
            border-radius: 4px;
            font-size: 13px;
            word-break: break-all;
            line-height: 1.5;
        }
        .fare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
        .fare-table th {
            background-color: #edf2f7;
            color: #4a5568;
            font-weight: 600;
            padding: 8px;
            border: 1px solid #cbd5e1;
        }
        .fare-table td {
            padding: 8px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
        }
        .editor-section {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        #youtube-player-container {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MY PASS</h1>
    <div class="subtitle">나만의 개성있는 스마트 교통카드 시스템</div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('register-tab')">카드 설정/등록</button>
        <button class="tab-btn" onclick="openTab('charge-tab')">잔액 충전</button>
        <button class="tab-btn" onclick="openTab('scan-tab')">버스 탑승 인식</button>
    </div>

    <!-- 1. 카드 등록 탭 -->
    <div id="register-tab" class="tab-content active">
        <h3>1. 카드 사용자 및 알림음 초기 설정</h3>
        <div class="form-group row">
            <div>
                <label for="user-name">사용자 이름</label>
                <input type="text" id="user-name" placeholder="홍길동" value="홍길동">
            </div>
            <div>
                <label for="user-age">연령대 분류</label>
                <select id="user-age">
                    <option value="어린이">어린이 (만 6~12세)</option>
                    <option value="청소년">청소년 (만 13~18세)</option>
                    <option value="일반" selected>일반 (성인)</option>
                    <option value="고령자">고령자 (우대 승차)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label for="yt-id">나만의 승차 알림음 (유튜브 ID)</label>
            <input type="text" id="yt-id" placeholder="예: dQw4w9WgXcQ" value="dQw4w9WgXcQ">
        </div>
        <div class="form-group row">
            <div>
                <label for="yt-start">알림음 시작 지점</label>
                <input type="text" id="yt-start" placeholder="00:10" value="00:10">
            </div>
            <div>
                <label for="yt-end">종료 지점 (최대 3초 제한)</label>
                <input type="text" id="yt-end" placeholder="00:13" value="00:13">
            </div>
        </div>
        <button type="button" style="margin-top:10px;" onclick="writePassToRFID()">스마트폰 NFC 기능으로 카드 정보 저장/수정</button>
        <div id="register-status" class="status-box">상태: 설정 대기 중...</div>
    </div>

    <!-- 2. 충전 탭 -->
    <div id="charge-tab" class="tab-content">
        <h3>2. 교통카드 대고 금액 충전하기</h3>
        <div class="form-group">
            <label for="charge-amount">충전할 금액 선택</label>
            <select id="charge-amount">
                <option value="5000">5,000 원 충전</option>
                <option value="10000" selected>10,000 원 충전</option>
                <option value="30000">30,000 원 충전</option>
            </select>
        </div>
        <button type="button" class="secondary" onclick="startNFCChargeMode()">NFC 충전 모드 활성화 (카드를 대세요)</button>
        <div id="charge-status" class="status-box">상태: 충전 버튼을 누르고 카드를 접촉해 주세요.</div>
    </div>

    <!-- 3. 탑승 인식 및 카테고리 관리 탭 -->
    <div id="scan-tab" class="tab-content">
        <h3>3. 버스 단말기 태그 및 요금표 실시간 조회</h3>
        
        <div class="form-group">
            <label for="category-select">탑승할 버스 종류 선택</label>
            <select id="category-select" onchange="renderFareTable()">
                <!-- JS 동적 로드 -->
            </select>
        </div>

        <div id="fare-table-container"></div>
        
        <button type="button" style="margin-bottom:10px;" onclick="startRFIDScan()">단말기 태그 활성화 (스마트폰용)</button>
        
        <button type="button" class="secondary" id="v-scan-btn" style="display:none; margin-bottom:5px;" onclick="triggerVirtualScan()">[PC 테스트] 정상 카드 태그</button>
        <button type="button" class="accent" id="v-error-btn" style="display:none; background-color:#64748b;" onclick="triggerVirtualErrorScan()">[PC 테스트] 잘못된 카드 태그</button>
        
        <div id="scan-status" class="status-box">상태: 단말기 대기 중...</div>

        <div class="editor-section">
            <h4 style="margin-top:0; margin-bottom:10px; color:#475569;">⚙ 버스 요금 카테고리 설정/수정</h4>
            <div class="form-group row">
                <div>
                    <label style="font-size:12px;">버스 노선 이름</label>
                    <input type="text" id="bus-name-input" placeholder="예: 시내버스">
                </div>
                <div>
                    <label style="font-size:12px;">일반(성인) 요금</label>
                    <input type="number" id="bus-fare-input" placeholder="1500">
                </div>
            </div>
            <div class="row">
                <button type="button" class="accent" onclick="saveBusCategory()">노선 추가 / 수정하기</button>
                <button type="button" class="danger" onclick="deleteBusCategory()">선택 노선 삭제</button>
            </div>
        </div>
    </div>
</div>

<div id="youtube-player-container">
    <div id="yt-hidden-player"></div>
</div>

<script>
    // 가상 저장소 초기 잔액을 15,000원으로 세팅해 둡니다.
    let virtualRFIDStorage = "홍길동|일반|15000|dQw4w9WgXcQ|00:10|00:13"; 
    let player; 
    let stopTimeout;
    let isScanModeActive = false;
    let busCategories = ["시내버스:1500", "마을버스:1200", "광역급행버스:2800"];

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-hidden-player', {
            height: '1px', width: '1px', videoId: '',
            events: { 
                'onReady': () => console.log("MY PASS 오디오 모듈 준비 완료")
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            }
        }, { once: true });
        
        loadBusCategoriesFromCookie();
        updateBusSelect();
    });

    function safeSpeak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        } else {
            alert(text);
        }
    }

    function convertToSeconds(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.trim().split(':');
        if (parts.length === 2) return (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10);
        return parseInt(parts[0], 10) || 0;
    }

    function setCookie(name, value, seconds) {
        const date = new Date();
        date.setTime(date.getTime() + (seconds * 1000));
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${date.toUTCString()}; path=/`;
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
        return null;
    }

    function loadBusCategoriesFromCookie() {
        const saved = getCookie("bus_panel_categories");
        if (saved) {
            try { busCategories = JSON.parse(saved); } catch(e) {}
        }
    }

    function saveBusCategory() {
        const nameInput = document.getElementById('bus-name-input');
        const fareInput = document.getElementById('bus-fare-input');
        const name = nameInput.value.trim();
        const fare = fareInput.value.trim();

        if(!name || !fare) return alert("버스 이름과 요금을 바르게 입력해주세요.");

        const existingIndex = busCategories.findIndex(b => b.startsWith(name + ":"));
        const combined = `${name}:${fare}`;

        if (existingIndex !== -1) {
            busCategories[existingIndex] = combined;
            alert(`'${name}' 노선의 요금 정보가 ${fare}원으로 수정되었습니다.`);
        } else {
            busCategories.push(combined);
            alert(`'${name}' 노선 카테고리가 새로 등록되었습니다.`);
        }

        setCookie("bus_panel_categories", JSON.stringify(busCategories), 365 * 24 * 60 * 60);
        updateBusSelect();
        nameInput.value = "";
        fareInput.value = "";
    }

    function deleteBusCategory() {
        const currentSelected = document.getElementById('category-select').value;
        if(!currentSelected) return alert("삭제할 대상을 선택상자에서 먼저 골라주세요.");
        
        const [targetName] = currentSelected.split(':');
        
        if(confirm(`'${targetName}' 카테고리를 삭제하시겠습니까?`)) {
            busCategories = busCategories.filter(b => !b.startsWith(targetName + ":"));
            setCookie("bus_panel_categories", JSON.stringify(busCategories), 365 * 24 * 60 * 60);
            updateBusSelect();
            alert("카테고리가 삭제되었습니다.");
        }
    }

    function updateBusSelect() {
        const select = document.getElementById('category-select');
        select.innerHTML = "";
        
        busCategories.forEach(bus => {
            const [busName, fare] = bus.split(':');
            const opt = document.createElement('option');
            opt.value = bus;
            opt.innerText = `${busName} (기본 ${fare}원)`;
            select.appendChild(opt);
        });

        if(select.value) {
            const [busName, fare] = select.value.split(':');
            document.getElementById('bus-name-input').value = busName;
            document.getElementById('bus-fare-input').value = fare;
        }
        renderFareTable();
    }

    function renderFareTable() {
        const select = document.getElementById('category-select');
        const container = document.getElementById('fare-table-container');
        
        if(!select.value) {
            container.innerHTML = "";
            return;
        }

        const [busName, fareStr] = select.value.split(':');
        const base = parseInt(fareStr);

        const fareChild = Math.round(base * 0.4);
        const fareYouth = Math.round(base * 0.7);
        const fareAdult = base;
        const fareSenior = 0;

        document.getElementById('bus-name-input').value = busName;
        document.getElementById('bus-fare-input').value = base;

        container.innerHTML = `
            <table class="fare-table">
                <thead>
                    <tr>
                        <th>어린이 (40%)</th>
                        <th>청소년 (70%)</th>
                        <th>일반 (성인)</th>
                        <th>고령자 (우대)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="color:#059669; font-weight:bold;">${fareChild}원</td>
                        <td style="color:#2563eb; font-weight:bold;">${fareYouth}원</td>
                        <td style="color:#1e293b; font-weight:bold;">${fareAdult}원</td>
                        <td style="color:#dc2626; font-weight:bold;">우대(0원)</td>
                    </tr>
                </tbody>
            </table>
        `;
    }

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // 💡 변경 포인트: 카드 설정/발급 시 기존 잔액 정보를 안전하게 유지하는 알고리즘 적용
    async function writePassToRFID() {
        const statusDiv = document.getElementById('register-status');
        const name = document.getElementById('user-name').value.trim() || "승객";
        const age = document.getElementById('user-age').value;
        const ytId = document.getElementById('yt-id').value.trim();
        const startRaw = document.getElementById('yt-start').value.trim();
        const endRaw = document.getElementById('yt-end').value.trim();

        if(!ytId) return alert("유튜브 오디오 ID를 등록해주세요.");

        if ('NDEFReader' in window) {
            // [실제 스마트폰 NFC 모드]
            try {
                statusDiv.innerText = "기존 카드 정보를 읽어오는 중... 뒷면에 카드를 밀착하세요.";
                const ndef = new NDEFReader();
                await ndef.scan();
                
                ndef.onreading = async (event) => {
                    const decoder = new TextDecoder();
                    let oldPayload = "";
                    for (const record of event.message.records) {
                        oldPayload = decoder.decode(record.data);
                    }
                    
                    // 기존 잔액 가져오기 (없거나 깨졌다면 0원)
                    let currentBalance = 0;
                    if (oldPayload && oldPayload.split('|').length >= 3) {
                        currentBalance = parseInt(oldPayload.split('|')[2]) || 0;
                    }
                    
                    // 잔액을 살린 상태로 새로운 카드 데이터 조합
                    const rfidPayload = `${name}|${age}|${currentBalance}|${ytId}|${startRaw}|${endRaw}`;
                    
                    await ndef.write({ records: [{ recordType: "text", data: rfidPayload }] });
                    statusDiv.innerText = `🎉 설정 변경 완료! [소유자: ${name} / 연령: ${age} / 유지된 잔액: ${currentBalance.toLocaleString()}원]`;
                    safeSpeak(`${name}님의 카드 설정이 변경되었습니다.`);
                };
            } catch (error) {
                statusDiv.innerText = `NFC 연동 실패: ${error}`;
            }
        } else {
            // [PC 가상 시뮬레이터 모드]
            let currentBalance = 0;
            if (virtualRFIDStorage && virtualRFIDStorage.split('|').length >= 3) {
                currentBalance = parseInt(virtualRFIDStorage.split('|')[2]) || 0;
            }

            // 기존 잔액(currentBalance) 그대로 파싱해서 조합
            const rfidPayload = `${name}|${age}|${currentBalance}|${ytId}|${startRaw}|${endRaw}`;
            virtualRFIDStorage = rfidPayload;
            
            statusDiv.innerHTML = `💡 [PC 가상 카드 정보 수정 완료] <br>• 이름: ${name} (${age}) <br>• <strong>유지된 기존 잔액: ${currentBalance.toLocaleString()}원</strong>`;
            safeSpeak(`${name}님의 카드 정보가 수정되었습니다.`);
        }
    }

    async function startNFCChargeMode() {
        const statusDiv = document.getElementById('charge-status');
        const inputChargeValue = parseInt(document.getElementById('charge-amount').value);

        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                statusDiv.innerText = `📡 [충전 대기] 카드를 휴대폰 뒷면에 접촉하세요. (+${inputChargeValue}원 누적)`;

                ndef.onreading = async (event) => {
                    const decoder = new TextDecoder();
                    let oldPayload = "";
                    for (const record of event.message.records) {
                        oldPayload = decoder.decode(record.data);
                    }

                    if(!oldPayload || oldPayload.split('|').length < 6) {
                        statusDiv.innerText = "❌ 올바르지 않은 카드 규격입니다.";
                        return;
                    }

                    let parts = oldPayload.split('|');
                    let currentBal = parseInt(parts[2]) || 0;
                    let newBal = currentBal + inputChargeValue;
                    parts[2] = newBal;

                    await ndef.write({ records: [{ recordType: "text", data: parts.join('|') }] });
                    statusDiv.innerText = `✅ 충전 완료! [현재 카드 잔액: ${newBal}원]`;
                    safeSpeak(`충전이 완료되었습니다. 잔액은 ${newBal}원입니다.`);
                };
            } catch (error) {
                statusDiv.innerText = `NFC 센서 에러: ${error}`;
            }
        } else {
            let parts = virtualRFIDStorage.split('|');
            if(parts.length < 6) return alert("교통카드가 감지되지 않았습니다.");
            let currentBal = parseInt(parts[2]) || 0;
            let newBal = currentBal + inputChargeValue;
            parts[2] = newBal;
            virtualRFIDStorage = parts.join('|');
            statusDiv.innerHTML = `💡 [PC 가상 충전 완료] <br>카드 기록 실시간 충전 잔액: <strong>${newBal}원</strong>`;
            safeSpeak(`충전이 완료되었습니다. 잔액은 ${newBal}원입니다.`);
        }
    }

    async function startRFIDScan() {
        const statusDiv = document.getElementById('scan-status');
        isScanModeActive = true;

        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                statusDiv.innerText = "🚌 실시간 잔액 조회 및 정산 결제를 시작합니다. 카드를 접촉해 주세요.";

                ndef.onreading = event => {
                    const decoder = new TextDecoder();
                    for (const record of event.message.records) {
                        processBusFareAndSound(decoder.decode(record.data));
                    }
                };
            } catch (error) {
                statusDiv.innerText = `센서 가동 실패: ${error}`;
            }
        } else {
            statusDiv.innerText = "💡 PC 가상 시뮬레이션 상태입니다. 아래의 수동 테스트 버튼을 사용하세요.";
            document.getElementById('v-scan-btn').style.display = 'block';
            document.getElementById('v-error-btn').style.display = 'block';
        }
    }

    function triggerVirtualScan() {
        if(!isScanModeActive) return alert("단말기 태그 활성화를 먼저 켜주세요.");
        processBusFareAndSound(virtualRFIDStorage);
    }

    function triggerVirtualErrorScan() {
        if(!isScanModeActive) return alert("단말기 태그 활성화를 먼저 켜주세요.");
        processBusFareAndSound("부적합한_규격_카드");
    }

    async function processBusFareAndSound(rawPayload) {
        const statusDiv = document.getElementById('scan-status');
        
        if (!rawPayload || rawPayload.split('|').length < 6) {
            statusDiv.innerHTML = `<span style="color:red; font-weight:bold; font-size:16px;">❌ 카드가 잘못되었습니다.</span>`;
            safeSpeak("카드가 잘못되었습니다.");
            if(player && typeof player.stopVideo === 'function') player.stopVideo();
            return;
        }

        const selectedBusData = document.getElementById('category-select').value;
        const [busName, baseFareStr] = selectedBusData.split(':');
        const baseFare = parseInt(baseFareStr);

        setCookie("temp_bus_payload", rawPayload, 10);
        setCookie("temp_bus_category", busName, 10);

        const cookedPayload = getCookie("temp_bus_payload");
        const cookedBusName = getCookie("temp_bus_category");

        let parts = cookedPayload.split('|');
        const name = parts[0];
        const age = parts[1];
        let cardBalance = parseInt(parts[2]) || 0; 
        const videoId = parts[3];
        const startStr = parts[4];
        const endStr = parts[5];

        let discountRate = 1.0; 
        if (age === "어린이") discountRate = 0.4;  
        if (age === "청소년") discountRate = 0.7;  
        if (age === "고령자") discountRate = 0.0;  

        const finalFare = Math.round(baseFare * discountRate);

        if (cardBalance < finalFare) {
            statusDiv.innerHTML = `<span style="color:red; font-weight:bold;">❌ 잔액이 부족합니다. (소유자: ${name} / 실시간 잔액: ${cardBalance}원)</span>`;
            safeSpeak("잔액이 부족합니다.");
            return;
        }

        cardBalance -= finalFare;
        parts[2] = cardBalance; 
        const updatedPayload = parts.join('|');

        if ('NDEFReader' in window && navigator.userAgent.includes("Mobi")) {
            try {
                const ndef = new NDEFReader();
                await ndef.write({ records: [{ recordType: "text", data: updatedPayload }] });
            } catch(e) { console.error(e); }
        } else {
            virtualRFIDStorage = updatedPayload; 
        }

        const startTime = convertToSeconds(startStr);
        const endTime = convertToSeconds(endStr);
        
        let duration = endTime - startTime;
        if (duration <= 0 || duration > 3) {
            duration = 3; 
        }

        statusDiv.innerHTML = `
            <span style="color:green; font-weight:bold; font-size:15px;">🚌 삐빅- 승차가 처리되었습니다</span><br>
            • 카드 주인: <strong>${name}</strong> (${age} 패스)<br>
            • 노선 정보: <strong>${cookedBusName}</strong><br>
            • 결제 금액: <span style="color:red; font-weight:bold;">${finalFare}원 차감</span><br>
            • 최종 잔액: <strong>${cardBalance.toLocaleString()}원</strong><br>
        `;

        const announcementText = (age === "고령자") ? "우대 패스입니다." : "감사합니다.";

        if (player && typeof player.loadVideoById === 'function') {
            clearTimeout(stopTimeout);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel(); 

            player.loadVideoById({ videoId: videoId, startSeconds: startTime });
            player.playVideo();
            player.unMute();

            statusDiv.innerHTML += `<br><span style="color:blue; font-weight:bold;">🎶 [1등] 나만의 알림음 재생 시작 (설정 시간: ${duration}초)</span>`;

            stopTimeout = setTimeout(() => {
                player.stopVideo(); 
                statusDiv.innerHTML += `<br><span style="color:#059669; font-weight:bold;">🗣 [2등] 알림음 종료 완료! 안내 방송을 재생합니다: "${announcementText}"</span>`;
                
                safeSpeak(announcementText); 
            }, duration * 1000);

        } else {
            safeSpeak(announcementText);
        }
    }
</script>
