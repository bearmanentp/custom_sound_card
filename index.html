<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY PASS - 나만의 개성있는 교통카드</title>
    <style>
        :root {
            --primary-color: #3b82f6; 
            --secondary-color: #10b981;
            --bg-color: #f1f5f9;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 25px;
        }
        .tabs {
            display: flex;
            gap: 5px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            margin-bottom: 8px;
        }
        .row > div {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        button.secondary {
            background-color: var(--secondary-color);
        }
        button.secondary:hover {
            background-color: #047857;
        }
        button.accent {
            background-color: #4f46e5;
        }
        button.accent:hover {
            background-color: #4338ca;
        }
        button.danger {
            background-color: #ef4444;
        }
        button.danger:hover {
            background-color: #dc2626;
        }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            background-color: #f8fafc;
            border-left: 4px solid #64748b;
            border-radius: 4px;
            font-size: 13px;
            word-break: break-all;
            line-height: 1.5;
        }
        .fare-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            margin-bottom: 15px;
            font-size: 13px;
            text-align: center;
        }
        .fare-table th {
            background-color: #edf2f7;
            color: #4a5568;
            font-weight: 600;
            padding: 8px;
            border: 1px solid #cbd5e1;
        }
        .fare-table td {
            padding: 8px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
        }
        .editor-section {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .preview-player-box {
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 10px;
            margin-bottom: 10px;
            aspect-ratio: 16 / 9;
            width: 100%;
        }
        .video-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .video-controls button {
            font-size: 12px;
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MY PASS</h1>
    <div class="subtitle">나만의 개성있는 스마트 교통카드 시스템</div>
    
    <div class="tabs">
        <button class="tab-btn active" id="btn-register-tab" onclick="openTab('register-tab')">카드 설정/등록</button>
        <button class="tab-btn" id="btn-charge-tab" onclick="openTab('charge-tab')">잔액 충전</button>
        <button class="tab-btn" id="btn-scan-tab" onclick="openTab('scan-tab')">버스 탑승 인식</button>
    </div>

    <!-- 1. 카드 등록 탭 -->
    <div id="register-tab" class="tab-content active">
        <h3>1. 카드 사용자 및 알림음 초기 설정</h3>
        <div class="form-group row">
            <div>
                <label for="user-name">사용자 이름</label>
                <input type="text" id="user-name" placeholder="홍길동" value="홍길동">
            </div>
            <div>
                <label for="user-age">연령대 분류</label>
                <select id="user-age">
                    <option value="어린이">어린이 (만 6~12세)</option>
                    <option value="청소년">청소년 (만 13~18세)</option>
                    <option value="일반" selected>일반 (성인)</option>
                    <option value="고령자">고령자 (우대 승차)</option>
                </select>
            </div>
        </div>
        
        <div class="form-group row">
            <div style="flex: 2;">
                <label for="yt-id">나만의 승차 알림음 (유튜브 ID)</label>
                <input type="text" id="yt-id" placeholder="예: dQw4w9WgXcQ" value="dQw4w9WgXcQ" onchange="loadPreviewVideo()">
            </div>
            <div>
                <label>&nbsp;</label>
                <button type="button" class="accent" onclick="loadPreviewVideo()">영상 불러오기</button>
            </div>
        </div>

        <div class="preview-player-box">
            <div id="yt-visible-player" style="width:100%; height:100%;"></div>
        </div>

        <div class="video-controls">
            <button type="button" class="secondary" onclick="captureTime('start')">⏱ 현재 시점을 [시작 지점]으로 채우기</button>
            <button type="button" class="secondary" style="background-color:#8b5cf6;" onclick="captureTime('end')">⏱ 현재 시점을 [종료 지점]으로 채우기</button>
        </div>

        <div class="form-group row">
            <div>
                <label for="yt-start">알림음 시작 지점</label>
                <input type="text" id="yt-start" placeholder="00:10.00" value="00:10.00">
            </div>
            <div>
                <label for="yt-end">종료 지점 (최대 3초 제한)</label>
                <input type="text" id="yt-end" placeholder="00:13.00" value="00:13.00">
            </div>
        </div>
        <button type="button" style="margin-top:10px;" onclick="writePassToRFID()">스마트폰 NFC 기능으로 카드 정보 저장/수정</button>
        <div id="register-status" class="status-box">상태: 설정 대기 중...</div>
    </div>

    <!-- 2. 충전 탭 -->
    <div id="charge-tab" class="tab-content">
        <h3>2. 교통카드 대고 금액 충전하기</h3>
        <div class="form-group">
            <label for="charge-amount">충전할 금액 선택</label>
            <select id="charge-amount">
                <option value="5000">5,000 원 충전</option>
                <option value="10000" selected>10,000 원 충전</option>
                <option value="30000">30,000 원 충전</option>
            </select>
        </div>
        <button type="button" class="secondary" onclick="startNFCChargeMode()">NFC 충전 모드 활성화 (카드를 대세요)</button>
        <div id="charge-status" class="status-box">상태: 충전 버튼을 누르고 카드를 접촉해 주세요.</div>
    </div>

    <!-- 3. 탑승 인식 및 카테고리 관리 탭 -->
    <div id="scan-tab" class="tab-content">
        <h3>3. 버스 단말기 태그 및 요금표 실시간 조회</h3>
        
        <div class="form-group">
            <label for="category-select">탑승할 버스 종류 선택</label>
            <select id="category-select" onchange="renderFareTable()">
                <!-- JS 동적 로드 -->
            </select>
        </div>

        <div id="fare-table-container"></div>
        
        <button type="button" id="scan-toggle-btn" class="accent" style="margin-bottom:10px; background-color: #4b5563;" onclick="toggleRFIDScan()">
            단말기 태그 기능 켜기 (현재: 꺼짐)
        </button>
        
        <button type="button" class="secondary" id="v-scan-btn" style="display:none; margin-bottom:5px;" onclick="triggerVirtualScan()">[PC 테스트] 정상 카드 태그</button>
        <button type="button" class="accent" id="v-error-btn" style="display:none; background-color:#64748b;" onclick="triggerVirtualErrorScan()">[PC 테스트] 잘못된/새 카드 태그</button>
        
        <div id="scan-status" class="status-box">상태: 단말기 기능이 꺼져 있습니다.</div>

        <div class="editor-section">
            <h4 style="margin-top:0; margin-bottom:10px; color:#475569;">⚙ 버스 요금 카테고리 설정/수정</h4>
            <div class="form-group row">
                <div>
                    <label style="font-size:12px;">버스 노선 이름</label>
                    <input type="text" id="bus-name-input" placeholder="예: 시내버스">
                </div>
                <div>
                    <label style="font-size:12px;">일반(성인) 요금</label>
                    <input type="number" id="bus-fare-input" placeholder="1500">
                </div>
            </div>
            <div class="row">
                <button type="button" class="accent" onclick="saveBusCategory()">노선 추가 / 수정하기</button>
                <button type="button" class="danger" onclick="deleteBusCategory()">선택 노선 삭제</button>
            </div>
        </div>
    </div>
</div>

<script>
    let virtualRFIDStorage = "홍길동|일반|15000|dQw4w9WgXcQ|00:10.00|00:13.00"; 
    let player; 
    let stopTimeout;
    let isScanModeActive = false; 
    let currentActiveTab = "register-tab"; 
    let busCategories = ["시내버스:1500", "마을버스:1200", "광역급행버스:2800"];

    // 오디오 동기화를 위한 전역 제어 변수들
    let targetDuration = 3.0;
    let postAnnouncement = "감사합니다.";

    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    function onYouTubeIframeAPIReady() {
        const initialId = document.getElementById('yt-id').value.trim() || 'dQw4w9WgXcQ';
        player = new YT.Player('yt-visible-player', {
            videoId: initialId,
            playerVars: { 'playsinline': 1, 'controls': 1, 'autoplay': 0, 'mute': 0 },
            events: { 
                'onReady': () => console.log("플레이어 로드 완료"),
                'onStateChange': onPlayerStateChange // 💡 핵심 수정: 버퍼링이 끝나고 재생이 진짜 시작되는 시점을 잡는 리스너 연결
            }
        });
    }

    // 💡 영상이 버퍼링을 끝내고 "실제로 소리를 내며 재생 시작(YT.PlayerState.PLAYING)"했을 때 타이머 가동
    function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            clearTimeout(stopTimeout);
            // 영상이 정상 출력을 시작한 시점부터 기획된 정확한 초만큼만 대기 후 정지시킴
            stopTimeout = setTimeout(() => {
                player.stopVideo(); 
                safeSpeak(postAnnouncement); 
            }, targetDuration * 1000);
        }
    }

    function loadPreviewVideo() {
        const ytId = document.getElementById('yt-id').value.trim();
        if(ytId && player && typeof player.loadVideoById === 'function') {
            player.loadVideoById({ videoId: ytId });
        }
    }

    function captureTime(type) {
        if(!player || typeof player.getCurrentTime !== 'function') return alert("영상이 준비되지 않았습니다.");
        const rawTime = player.getCurrentTime(); 
        const minutes = Math.floor(rawTime / 60);
        const seconds = Math.floor(rawTime % 60);
        const milliSeconds = Math.floor((rawTime % 1) * 100); 
        const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliSeconds).padStart(2, '0')}`;

        if(type === 'start') {
            document.getElementById('yt-start').value = formattedTime;
            const endRaw = rawTime + 3.0;
            document.getElementById('yt-end').value = `${String(Math.floor(endRaw / 60)).padStart(2, '0')}:${String(Math.floor(endRaw % 60)).padStart(2, '0')}.${String(Math.floor((endRaw % 1) * 100)).padStart(2, '0')}`;
        } else if(type === 'end') {
            document.getElementById('yt-end').value = formattedTime;
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        document.body.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
            }
        }, { once: true });
        loadBusCategoriesFromCookie();
        updateBusSelect();
    });

    function safeSpeak(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            window.speechSynthesis.speak(utterance);
        }
    }

    function convertToSeconds(timeStr) {
        if (!timeStr) return 0;
        let mainStr = timeStr.trim();
        let milli = 0;
        if (mainStr.includes('.')) {
            const dotParts = mainStr.split('.');
            mainStr = dotParts[0]; 
            milli = parseFloat("0." + dotParts[1]) || 0; 
        }
        const parts = mainStr.split(':');
        if (parts.length === 2) {
            return (parseInt(parts[0], 10) * 60) + parseInt(parts[1], 10) + milli;
        }
        return parseInt(parts[0], 10) + milli || 0;
    }

    function setCookie(name, value, seconds) {
        const date = new Date();
        date.setTime(date.getTime() + (seconds * 1000));
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${date.toUTCString()}; path=/`;
    }

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
        return null;
    }

    function loadBusCategoriesFromCookie() {
        const saved = getCookie("bus_panel_categories");
        if (saved) { try { busCategories = JSON.parse(saved); } catch(e) {} }
    }

    function saveBusCategory() {
        const name = document.getElementById('bus-name-input').value.trim();
        const fare = document.getElementById('bus-fare-input').value.trim();
        if(!name || !fare) return;
        const idx = busCategories.findIndex(b => b.startsWith(name + ":"));
        if (idx !== -1) busCategories[idx] = `${name}:${fare}`;
        else busCategories.push(`${name}:${fare}`);
        setCookie("bus_panel_categories", JSON.stringify(busCategories), 365*24*60*60);
        updateBusSelect();
    }

    function deleteBusCategory() {
        const cur = document.getElementById('category-select').value;
        if(!cur) return;
        const [targetName] = cur.split(':');
        busCategories = busCategories.filter(b => !b.startsWith(targetName + ":"));
        setCookie("bus_panel_categories", JSON.stringify(busCategories), 365*24*60*60);
        updateBusSelect();
    }

    function updateBusSelect() {
        const select = document.getElementById('category-select');
        select.innerHTML = "";
        busCategories.forEach(bus => {
            const [busName, fare] = bus.split(':');
            const opt = document.createElement('option');
            opt.value = bus;
            opt.innerText = `${busName} (기본 ${fare}원)`;
            select.appendChild(opt);
        });
        renderFareTable();
    }

    function renderFareTable() {
        const select = document.getElementById('category-select');
        const container = document.getElementById('fare-table-container');
        if(!select.value) return;
        const [busName, fareStr] = select.value.split(':');
        const base = parseInt(fareStr);
        container.innerHTML = `
            <table class="fare-table">
                <thead><tr><th>어린이 (40%)</th><th>청소년 (70%)</th><th>일반 (성인)</th><th>고령자 (우대)</th></tr></thead>
                <tbody><tr>
                    <td style="color:#059669; font-weight:bold;">${Math.round(base * 0.4)}원</td>
                    <td style="color:#2563eb; font-weight:bold;">${Math.round(base * 0.7)}원</td>
                    <td style="color:#1e293b; font-weight:bold;">${base}원</td>
                    <td style="color:#dc2626; font-weight:bold;">우대(0원)</td>
                </tr></tbody>
            </table>
        `;
    }

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        const targetBtn = document.getElementById('btn-' + tabId);
        if(targetBtn) targetBtn.classList.add('active');
        currentActiveTab = tabId; 
        if (player && typeof player.pauseVideo === 'function') player.pauseVideo();
        if (tabId === 'register-tab' || tabId === 'charge-tab') {
            isScanModeActive = false;
            updateScanButtonUI();
        }
    }

    // 카드 등록
    async function writePassToRFID() {
        const statusDiv = document.getElementById('register-status');
        const name = document.getElementById('user-name').value.trim() || "새사용자";
        const age = document.getElementById('user-age').value;
        const ytId = document.getElementById('yt-id').value.trim();
        const startRaw = document.getElementById('yt-start').value.trim();
        const endRaw = document.getElementById('yt-end').value.trim();

        let currentBalance = 0;
        if(virtualRFIDStorage && virtualRFIDStorage.split('|').length === 6) {
            currentBalance = parseInt(virtualRFIDStorage.split('|')[2]) || 0;
        }

        const rfidPayload = `${name}|${age}|${currentBalance}|${ytId}|${startRaw}|${endRaw}`;

        if ('NDEFReader' in window) {
            try {
                statusDiv.innerText = "카드에 쓰고 있습니다. 뒷면에 밀착하세요...";
                const ndef = new NDEFReader();
                await ndef.scan();
                ndef.onreading = async () => {
                    if(currentActiveTab !== "register-tab") return;
                    await ndef.write({ records: [{ recordType: "text", data: rfidPayload }] });
                    statusDiv.innerText = `🎉 카드 등록 성공! [소유자: ${name} / 잔액: ${currentBalance}원]`;
                    safeSpeak(`${name}님의 카드가 등록되었습니다.`);
                };
            } catch (error) { statusDiv.innerText = `NFC 에러: ${error}`; }
        } else {
            virtualRFIDStorage = rfidPayload;
            statusDiv.innerHTML = `💡 [가상 카드 등록 완료] <br>• 이름: ${name} (${age}) <br>• 현재 잔액: ${currentBalance}원`;
            safeSpeak(`${name}님의 카드가 등록되었습니다.`);
        }
    }

    // 금액 충전
    async function startNFCChargeMode() {
        const statusDiv = document.getElementById('charge-status');
        const inputChargeValue = parseInt(document.getElementById('charge-amount').value);

        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.scan();
                statusDiv.innerText = "📡 충전할 카드를 접촉해 주세요.";
                ndef.onreading = async (event) => {
                    if(currentActiveTab !== "charge-tab") return;
                    const decoder = new TextDecoder();
                    let oldPayload = "";
                    for (const record of event.message.records) oldPayload = decoder.decode(record.data);

                    if(!oldPayload || oldPayload.split('|').length < 6) {
                        statusDiv.innerText = "❌ 데이터가 없는 카드입니다. 등록 화면으로 이동합니다.";
                        safeSpeak("데이터가 없는 카드는 다른 카드를 사용하여 주세요");
                        virtualRFIDStorage = "초기화"; 
                        setTimeout(() => openTab('register-tab'), 1200);
                        return;
                    }

                    let parts = oldPayload.split('|');
                    let newBal = (parseInt(parts[2]) || 0) + inputChargeValue;
                    parts[2] = newBal;
                    await ndef.write({ records: [{ recordType: "text", data: parts.join('|') }] });
                    statusDiv.innerText = `✅ 충전 완료! [잔액: ${newBal}원]`;
                    safeSpeak("충전이 완료되었습니다.");
                };
            } catch (error) { statusDiv.innerText = `NFC 오류: ${error}`; }
        } else {
            let parts = virtualRFIDStorage.split('|');
            if(parts.length < 6) {
                statusDiv.innerText = "❌ 올바르지 않은 카드입니다. 리셋 후 등록 탭으로 이동합니다.";
                safeSpeak("데이터가 없는 카드는 다른 카드를 사용하여 주세요");
                virtualRFIDStorage = "초기화";
                setTimeout(() => openTab('register-tab'), 1200);
                return;
            }
            let newBal = (parseInt(parts[2]) || 0) + inputChargeValue;
            parts[2] = newBal;
            virtualRFIDStorage = parts.join('|');
            statusDiv.innerHTML = `💡 [충전 완료] 최종 잔액: ${newBal}원`;
            safeSpeak("충전이 완료되었습니다.");
        }
    }

    // 단말기 제어
    async function toggleRFIDScan() {
        const statusDiv = document.getElementById('scan-status');
        if (isScanModeActive) {
            isScanModeActive = false;
            updateScanButtonUI();
            statusDiv.innerText = "상태: 단말기 기능이 꺼졌습니다.";
        } else {
            isScanModeActive = true;
            updateScanButtonUI();
            statusDiv.innerText = "🚌 카드를 접촉해 주세요.";

            if ('NDEFReader' in window) {
                try {
                    const ndef = new NDEFReader();
                    await ndef.scan();
                    ndef.onreading = event => {
                        if (isScanModeActive && currentActiveTab === "scan-tab") {
                            const decoder = new TextDecoder();
                            for (const record of event.message.records) processBusFareAndSound(decoder.decode(record.data));
                        }
                    };
                } catch (error) { statusDiv.innerText = `센서 오류: ${error}`; }
            } else {
                document.getElementById('v-scan-btn').style.display = 'block';
                document.getElementById('v-error-btn').style.display = 'block';
            }
        }
    }

    function updateScanButtonUI() {
        const btn = document.getElementById('scan-toggle-btn');
        if (isScanModeActive) {
            btn.innerText = "단말기 기능 끄기 (🟢 작동중)";
            btn.style.backgroundColor = "#ef4444"; 
        } else {
            btn.innerText = "단말기 기능 켜기 (🔴 정지됨)";
            btn.style.backgroundColor = "#3b82f6"; 
            document.getElementById('v-scan-btn').style.display = 'none';
            document.getElementById('v-error-btn').style.display = 'none';
        }
    }

    function triggerVirtualScan() { processBusFareAndSound(virtualRFIDStorage); }
    function triggerVirtualErrorScan() { processBusFareAndSound("부적합한_데이터_공백카드"); }

    // 탑승 가동 핵심 로직
    async function processBusFareAndSound(rawPayload) {
        if (!isScanModeActive || currentActiveTab !== "scan-tab") return; 
        const statusDiv = document.getElementById('scan-status');
        
        if (!rawPayload || rawPayload.split('|').length < 6 || rawPayload.includes("부적합한")) {
            statusDiv.innerHTML = `<span style="color:#ef4444; font-weight:bold;">❌ 미등록 카드입니다. 새 카드로 포맷 후 등록 화면으로 이동합니다.</span>`;
            safeSpeak("데이터가 없는 카드는 다른 카드를 사용하여 주세요");
            
            virtualRFIDStorage = "새사용자|일반|0|dQw4w9WgXcQ|00:10.00|00:13.00"; 
            
            setTimeout(() => {
                openTab('register-tab');
                document.getElementById('register-status').innerHTML = `<span style="color:#3b82f6; font-weight:bold;">🆕 새 카드 연동 완료! 데이터를 입력하고 등록 버튼을 누르면 새 카드로 저장됩니다.</span>`;
            }, 1200);
            return;
        }

        let parts = rawPayload.split('|');
        const name = parts[0];
        const age = parts[1];
        let cardBalance = parseInt(parts[2]) || 0; 
        const videoId = parts[3];
        const startStr = parts[4];
        const endStr = parts[5];

        const selectedBusData = document.getElementById('category-select').value;
        const [busName, baseFareStr] = selectedBusData.split(':');
        const baseFare = parseInt(baseFareStr);

        let discountRate = 1.0; 
        if (age === "어린이") discountRate = 0.4;  
        if (age === "청소년") discountRate = 0.7;  
        if (age === "고령자") discountRate = 0.0;  

        const finalFare = Math.round(baseFare * discountRate);

        if (cardBalance < finalFare) {
            statusDiv.innerHTML = `<span style="color:#ef4444; font-weight:bold;">❌ 잔액 부족 (현재 잔액: ${cardBalance}원 / 필요 요금: ${finalFare}원)</span>`;
            safeSpeak("잔액이 부족합니다.");
            return;
        }

        cardBalance -= finalFare;
        parts[2] = cardBalance; 
        const updatedPayload = parts.join('|');

        if ('NDEFReader' in window) {
            try {
                const ndef = new NDEFReader();
                await ndef.write({ records: [{ recordType: "text", data: updatedPayload }] });
            } catch(e) {}
        } else {
            virtualRFIDStorage = updatedPayload; 
        }

        const startTime = convertToSeconds(startStr);
        const endTime = convertToSeconds(endStr);
        
        // 💡 중요 수정: 로컬 동기적 타이머 대신 이벤트 리스너에 초단위 시간 전달
        targetDuration = endTime - startTime;
        if (targetDuration <= 0 || targetDuration > 3.05) targetDuration = 3.0;

        statusDiv.innerHTML = `
            <span style="color:#10b981; font-weight:bold; font-size:15px;">🚌 정상 승차 처리되었습니다. (카드 수정 완료)</span><br>
            • 탑승자: <strong>${name}</strong> (${age})<br>
            • 기본요금: ${baseFare}원 ➡️ <strong>결제금액: ${finalFare}원</strong><br>
            • 카드 잔액: <span style="color:#2563eb; font-weight:bold;">${cardBalance.toLocaleString()}원</span>
        `;

        postAnnouncement = (age === "고령자") ? "우대 패스입니다." : "감사합니다.";

        if (player && typeof player.loadVideoById === 'function') {
            clearTimeout(stopTimeout); // 기존 예약된 오디오 정지 태스크 초기화
            player.unMute(); 
            player.setVolume(100); 
            
            // 영상을 불러와 재생 대기열에 올립니다. 
            // 실제로 재생이 시작되는 순간 상단의 onPlayerStateChange가 가동되어 비디오가 커트됩니다.
            player.loadVideoById({
                videoId: videoId,
                startSeconds: startTime
            });
            player.playVideo(); 
        } else {
            safeSpeak(postAnnouncement);
        }
    }
</script>
